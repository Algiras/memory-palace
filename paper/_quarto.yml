project:
  type: manuscript
  output-dir: _output
  resources:
    - figures/*
  render:
    - index.qmd
    - sections/*.qmd

manuscript:
  article: index.qmd
  
book:
  title: "Memory Palace: Method of Loci for LLM Memory Systems"
  author: "Memory Palace Research Team"
  date: last-modified
  chapters:
    - index.qmd
    - sections/01-introduction.qmd
    - sections/02-related-work.qmd
    - sections/03-methodology.qmd
    - sections/04-system-architecture.qmd
    - sections/05-experiments.qmd
    - sections/06-results.qmd
    - sections/07-discussion.qmd
    - sections/08-conclusion.qmd
  appendices:
    - sections/appendix-a-smashin-scope.qmd
    - sections/appendix-b-code.qmd
    - sections/appendix-c-trace.qmd

format:
  html:
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    theme: cosmo
  pdf:
    documentclass: article
    papersize: letter
    fontsize: 11pt
    geometry:
      - margin=1in
    include-in-header:
      - text: |
          \usepackage{booktabs}
          \usepackage{algorithm}
          \usepackage{algorithmic}
  docx: default

execute:
  enabled: false

bibliography: references.bib
csl: acm-sig-proceedings.csl

author:
  - name: Memory Palace Research Team
    affiliation: Independent Research

date: last-modified

keywords:
  - LLM memory
  - retrieval augmented generation
  - hierarchical retrieval
  - hallucination detection
  - context efficiency
  - RAG systems
