name: Build and Release Book

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.4.549

      - name: Install TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Build PDF
        run: |
          cd paper
          quarto render index.qmd --to pdf

      - name: Build HTML Book
        run: |
          cd paper
          quarto render index.qmd --to html

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-palace-book-pdf
          path: paper/_output/index.pdf

      - name: Upload HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-palace-book-html
          path: paper/_output/index.html

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/memory-palace-book-pdf/index.pdf
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}